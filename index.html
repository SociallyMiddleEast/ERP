<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tideline — Home</title>
  <script>
    // Apply saved theme before paint (no flash)
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ================= THEME TOKENS ================= */
:root,
:root[data-theme="dark"] {
  --bg: #0a1416;
  --glow-warm: rgba(214, 120, 50, .16);
  --glow-cool: rgba(70, 190, 180, .07);
  --bar: rgba(17, 29, 32, .82);
  --surface: #13222a;
  --track: rgba(255, 255, 255, .035);
  --hover: rgba(255, 255, 255, .06);
  --border: rgba(255, 255, 255, .07);
  --text: #e8f1f1;
  --muted: #8a9fa2;
  --faint: #5f7477;
  --accent: #66d6cc;
  --accent-ink: #052421;
  --new-bg: #66d6cc;
  --new-ink: #052421;
  --accent-glow: rgba(102, 214, 204, .35);
  --danger: #ef5050;
  --ok: #46d17a;
  --wave-line: rgba(102, 214, 204, .06);
  --wave-1: rgba(80, 190, 185, .26);
  --wave-2: rgba(40, 120, 120, .18);
  --wave-back: rgba(80, 190, 185, .12);
  --ghost: rgba(255, 255, 255, .035);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
}
:root[data-theme="light"] {
  --bg: #e6f2f2;
  --glow-warm: rgba(255, 196, 120, .38);
  --glow-cool: rgba(120, 210, 205, .25);
  --bar: rgba(255, 255, 255, .82);
  --surface: #ffffff;
  --track: rgba(10, 50, 50, .035);
  --hover: rgba(10, 50, 50, .05);
  --border: rgba(10, 50, 50, .08);
  --text: #10262a;
  --muted: #5d7377;
  --faint: #8ea1a4;
  --accent: #4cc7bc;
  --accent-ink: #062b27;
  --new-bg: #1c8e84;
  --new-ink: #ffffff;
  --accent-glow: rgba(40, 170, 160, .28);
  --danger: #e04545;
  --ok: #1fae5b;
  --wave-line: rgba(30, 140, 135, .10);
  --wave-1: rgba(110, 205, 198, .40);
  --wave-2: rgba(170, 225, 222, .65);
  --wave-back: rgba(110, 205, 198, .20);
  --ghost: rgba(255, 255, 255, .7);
  --shadow: 0 14px 40px rgba(20, 70, 70, .12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }

body {
  font-family: "Outfit", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 12px 16px 40px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ================= BACKGROUND ================= */
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg-glow {
  position: absolute; inset: -10%;
  background:
    radial-gradient(40% 35% at 72% 18%, var(--glow-warm), transparent 70%),
    radial-gradient(45% 40% at 12% 70%, var(--glow-cool), transparent 70%);
  animation: drift 20s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(-3%, 2%, 0) scale(1.04); } }
.bg-waves { position: absolute; left: -5%; width: 110%; bottom: 0; height: 55vh; }
.bg-waves path { fill: var(--wave-line); }
.bg-waves .w1 { animation: sway 14s ease-in-out infinite alternate; }
.bg-waves .w2 { animation: sway 18s ease-in-out infinite alternate-reverse; }
@keyframes sway { to { transform: translateX(-4%); } }

/* ================= THEME CIRCLE REVEAL ================= */
::view-transition-old(root),
::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-new(root) { z-index: 2; }

/* ================= TOP BAR ================= */
.topbar {
  position: sticky; top: 12px; z-index: 50;
  max-width: 1320px; margin: 0 auto;
  background: var(--bar);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  animation: bar-in .8s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes bar-in { from { opacity: 0; transform: translateY(-16px); filter: blur(6px); } }

.nav { display: flex; align-items: center; gap: 18px; padding: 9px 12px 9px 12px; }

.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
  transition: transform .5s cubic-bezier(.3, 1.6, .5, 1);
}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); }
.brand-name { font-weight: 600; font-size: 19px; letter-spacing: -.015em; }

/* ---------- Tabs + liquid pill ---------- */
.tabs {
  position: relative;
  display: flex; align-items: center; gap: 0;
  padding: 3px;
  background: var(--track);
  border: 1px solid var(--border);
  border-radius: 13px;
}
.tab {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px;
  font-size: 13.5px; font-weight: 450; white-space: nowrap;
  color: var(--muted);
  border-radius: 10px;
  transition: color .35s ease;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-ink); font-weight: 500; }
.tab .count {
  font-size: 10.5px; font-weight: 600; line-height: 1;
  min-width: 18px; padding: 3px 5px; border-radius: 6px; text-align: center;
  background: var(--hover); color: var(--text);
  transition: background .35s, color .35s;
}
.tab.active .count { background: rgba(0, 0, 0, .14); color: var(--accent-ink); }

.pill {
  position: absolute; top: 3px; bottom: 3px;
  left: var(--l, 3px); right: var(--r, 100%);
  border-radius: 10px;
  background: var(--accent);
  box-shadow: 0 4px 16px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .35);
  opacity: 0;
}
.pill.ready { opacity: 1; }
/* The leading edge rushes ahead, the trailing edge catches up = liquid stretch */
.pill.to-right { transition: right .32s cubic-bezier(.55, 0, .15, 1), left .62s cubic-bezier(.65, 0, .2, 1) .08s; }
.pill.to-left  { transition: left .32s cubic-bezier(.55, 0, .15, 1), right .62s cubic-bezier(.65, 0, .2, 1) .08s; }

.chev { transition: transform .3s ease; }
.menu.open > [data-toggle] .chev { transform: rotate(180deg); }

/* Click ring */
.click-ring {
  position: fixed; z-index: 200; pointer-events: none;
  width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, .7);
  animation: ring-out .65s cubic-bezier(.2, .7, .3, 1) forwards;
}
[data-theme="light"] .click-ring { border-color: rgba(10, 60, 60, .45); }
@keyframes ring-out {
  from { transform: scale(.35); opacity: 1; }
  to { transform: scale(1.25); opacity: 0; }
}

/* ---------- Actions ---------- */
.actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  position: relative;
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  background: var(--track);
  color: var(--muted);
  transition: color .2s, background .2s, transform .15s;
}
.icon-btn:hover { color: var(--text); background: var(--hover); }
.icon-btn:active { transform: scale(.92); }

.btn-new {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 16px; border-radius: 11px;
  font-weight: 500; font-size: 14px;
  background: var(--new-bg); color: var(--new-ink);
  box-shadow: 0 6px 20px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .3);
  transition: transform .15s, box-shadow .3s;
}
.btn-new:hover { box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn-new:active { transform: scale(.95); }
.btn-new svg { transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
.btn-new:hover svg { transform: rotate(90deg); }

/* theme icons: dark shows sun, light shows moon */
#theme-btn svg { position: absolute; transition: transform .6s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; }
[data-theme="dark"] .ico-moon,
[data-theme="light"] .ico-sun { opacity: 0; transform: rotate(-120deg) scale(.3); }

.bell:hover svg { animation: bell .7s ease; transform-origin: 50% 8%; }
@keyframes bell { 20% { transform: rotate(14deg); } 40% { transform: rotate(-11deg); } 60% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } }
.badge {
  position: absolute; top: -5px; right: -5px;
  min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
  display: grid; place-items: center;
  font-size: 9.5px; font-weight: 700; color: #fff;
  background: var(--danger);
  border: 2px solid var(--surface);
  transition: transform .35s cubic-bezier(.5, -0.6, .5, 1);
}
.badge.hide { transform: scale(0); }

.avatar-btn { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 2px; color: var(--muted); }
.avatar-btn:hover { color: var(--text); }
.avatar {
  position: relative; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  background: #e7eddc; color: #1d2a1d;
  transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
}
.avatar-btn:hover .avatar { transform: scale(1.06); }
.online { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--surface); }

/* ================= DROPDOWNS ================= */
.menu { position: relative; }
.dropdown {
  position: absolute; top: calc(100% + 10px); left: 0; z-index: 5;
  min-width: 190px; padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  opacity: 0; visibility: hidden;
  transform: translateY(-6px) scale(.97);
  transform-origin: top left;
  filter: blur(4px);
  transition: opacity .2s, transform .3s cubic-bezier(.2, .9, .3, 1.1), filter .25s, visibility .2s;
}
.dropdown-right { left: auto; right: 0; transform-origin: top right; }
.menu.open > .dropdown { opacity: 1; visibility: visible; transform: none; filter: none; }
.dd-item { display: block; padding: 9px 12px; border-radius: 9px; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; }
.dd-item:hover { background: var(--hover); color: var(--text); }
.dd-item.active { color: var(--accent); }
.dd-item.danger:hover { color: var(--danger); }
.dd-user { padding: 10px 12px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.dd-user b, .dd-user small { display: block; }
.dd-user small { color: var(--muted); font-size: 12px; margin-top: 2px; }
/* Grouped "More" menu */
.dropdown.mega { width: 240px; padding: 8px; }
.dd-group + .dd-group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.dd-group-label { padding: 6px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.dropdown.mega .dd-item { display: flex; align-items: center; gap: 10px; }
.dd-icon {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--hover); color: var(--muted);
  transition: background .2s, color .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
.dd-item:hover .dd-icon { color: var(--accent); transform: scale(1.08); }
.dd-item.active .dd-icon { background: var(--accent); color: var(--accent-ink); }
.menu.open .dropdown.mega .dd-item { animation: sub-in .4s cubic-bezier(.2, .8, .2, 1) both; }
.menu.open .dropdown.mega .dd-group:nth-child(2) .dd-item { animation-delay: .05s; }
.menu.open .dropdown.mega .dd-group:nth-child(3) .dd-item { animation-delay: .1s; }

.notif { width: 320px; }
.dd-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 10px; font-weight: 600; font-size: 14px; }
.link-btn { font-size: 12px; color: var(--accent); }
.notif-item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; font-size: 13.5px; color: var(--muted); line-height: 1.35; transition: background .15s; }
.notif-item:hover { background: var(--hover); }
.notif-item b { color: var(--text); font-weight: 600; }
.notif-item small { display: block; font-size: 11.5px; margin-top: 3px; opacity: .8; }
.n-dot { flex-shrink: 0; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; transition: background .3s; }
.notif-item.unread .n-dot { background: var(--accent); }

/* ================= SUBBAR ================= */
.subbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 40px; padding: 0 16px;
  border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--muted);
}
.subbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; height: 100%; }
.crumbs { display: flex; align-items: center; gap: 8px; list-style: none; white-space: nowrap; }
.crumbs .sep { opacity: .6; }
.crumbs .current { color: var(--text); font-weight: 500; }
.crumbs .enter { animation: crumb-in .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes crumb-in { from { opacity: 0; transform: translateX(-8px); filter: blur(3px); } }

.sub-divider {
  width: 1px; height: 14px; background: var(--border);
  transform: scaleY(0); transition: transform .3s ease;
}
.sub-divider.show { transform: scaleY(1); }

.subtabs { position: relative; display: flex; align-items: center; gap: 4px; height: 100%; overflow-x: auto; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 100%; padding: 0 8px;
  color: var(--muted); white-space: nowrap;
  transition: color .25s;
  animation: sub-in .5s cubic-bezier(.2, .8, .2, 1) both;
  animation-delay: calc(.12s + var(--i) * .08s);
}
.subtab:hover { color: var(--text); }
.subtab.active { color: var(--text); font-weight: 500; }
.subtab.action { color: var(--accent); font-weight: 500; }
.subtab.action:hover { filter: brightness(1.15); }
.subtab.action svg { transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
.subtab.action:hover svg { transform: rotate(90deg); }
.crumb-link { transition: color .2s; }
.crumb-link:hover { color: var(--text); }
.crumbs .enter { display: inline-block; }
.subtab .count { font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 5px; background: var(--hover); color: var(--text); }
@keyframes sub-in { from { opacity: 0; transform: translateX(-10px); filter: blur(4px); } }
.subtabs.leaving .subtab { animation: sub-out .18s ease forwards; }
@keyframes sub-out { to { opacity: 0; transform: translateX(6px); filter: blur(3px); } }

.sub-line {
  position: absolute; bottom: -1px; left: 0; height: 2px; border-radius: 2px;
  background: var(--accent);
  transform-origin: left;
  transition: transform .45s cubic-bezier(.3, 1.2, .4, 1), width .45s cubic-bezier(.3, 1.2, .4, 1);
}
.sub-line.grow { animation: line-grow .5s .25s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes line-grow { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.status { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: online 2.2s infinite; }
@keyframes online { 0% { box-shadow: 0 0 0 0 rgba(70, 209, 122, .55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(70, 209, 122, 0); } }
.status-text { display: inline; }

/* ================= PAGE (placeholder) ================= */
.page { max-width: 1320px; margin: 34px auto 0; padding: 0 4px; }
.page-title { font-size: clamp(28px, 3.6vw, 36px); font-weight: 500; letter-spacing: -.02em; min-height: 1.25em; }
.page-title .caret { display: inline-block; width: 2px; height: .9em; margin-left: 2px; vertical-align: -0.08em; background: var(--accent); animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.page-sub { color: var(--muted); font-size: 14px; margin-top: 6px; min-height: 1.4em; }

.ghost-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 26px; }
.ghost { height: 120px; border-radius: 16px; background: var(--ghost); border: 1px solid var(--border); }
.ghost.wide { grid-column: span 3; height: 300px; }
.ghost.side { height: 300px; }
.ghost.g1 { background: linear-gradient(135deg, rgba(60, 170, 165, .18), var(--ghost)); }
.ghost.g2 { background: linear-gradient(135deg, rgba(190, 150, 60, .16), var(--ghost)); }
.ghost.g3 { background: linear-gradient(135deg, rgba(70, 120, 200, .16), var(--ghost)); }
.ghost.g4 { background: linear-gradient(135deg, rgba(210, 110, 60, .16), var(--ghost)); }

/* page out / in */
.page.out .page-sub, .page.out .ghost { opacity: 0; filter: blur(10px); transform: translateY(14px) scale(.98); transition: opacity .35s ease, filter .35s ease, transform .35s ease; }
.page.out .page-title { opacity: 0; transition: opacity .2s; }
.page.in .page-sub { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both .15s; }
.page.in .ghost { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.2s + var(--d, 0) * .06s); }
@keyframes rise { from { opacity: 0; filter: blur(10px); transform: translateY(18px) scale(.98); } }

/* ================= WAVE SWEEP ================= */
.sweep {
  position: fixed; inset: 0; z-index: 40; pointer-events: none;
  overflow: hidden; visibility: hidden;
}
.sweep svg { position: absolute; left: -10%; width: 120%; height: 150vh; top: 100%; }
.sweep .sw-back { fill: var(--wave-back); }
.sweep.run { visibility: visible; }
.sweep.run svg { animation: sweep-up 1.15s cubic-bezier(.55, .05, .3, 1) forwards; }
.sweep.run .sw-front { animation: wobble 1.15s ease-in-out; }
.sweep.run .sw-back { animation: wobble 1.15s ease-in-out reverse; }
@keyframes sweep-up { to { transform: translateY(calc(-100% - 100vh)); } }
@keyframes wobble { 50% { transform: translateX(-4%); } }

/* ================= MOBILE ================= */
.burger { display: none; gap: 4px; align-content: center; justify-items: center; }
.burger span { display: block; width: 16px; height: 2px; border-radius: 2px; background: currentColor; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), opacity .2s; }
.burger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.mobile-menu { display: grid; gap: 2px; grid-template-rows: 0fr; overflow: hidden; }
.mobile-menu-inner { min-height: 0; display: grid; gap: 2px; padding: 0 10px; transition: padding .3s; }
.mobile-menu { transition: grid-template-rows .45s cubic-bezier(.3, 1, .4, 1); }
.mobile-menu.open { grid-template-rows: 1fr; border-top: 1px solid var(--border); }
.mobile-menu.open .mobile-menu-inner { padding: 8px 10px 12px; }
.mobile-menu a {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 12px; border-radius: 10px; color: var(--muted); font-weight: 500;
  opacity: 0; transform: translateX(-10px); filter: blur(3px);
  transition: background .2s, color .2s, opacity .35s, transform .35s, filter .35s;
}
.mobile-menu.open a { opacity: 1; transform: none; filter: none; }
.mobile-menu a:hover { background: var(--hover); color: var(--text); }
.mobile-menu a.active { background: var(--accent); color: var(--accent-ink); }
.mobile-menu a { justify-content: flex-start; gap: 12px; }
.m-icon { display: grid; place-items: center; opacity: .85; }
.m-group {
  padding: 14px 12px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
  opacity: 0; transition: opacity .35s;
}
.mobile-menu.open .m-group { opacity: 1; }
#palette-list li { display: flex; align-items: center; gap: 10px; }

@media (max-width: 1100px) {
  .tabs { display: none; }
  .burger { display: grid; }
  .ghost-grid { grid-template-columns: repeat(2, 1fr); }
  .ghost.wide { grid-column: span 2; }
  .ghost.side { grid-column: span 2; height: 180px; }
}
@media (min-width: 1101px) { .mobile-menu { display: none; } }
@media (max-width: 640px) {
  .btn-new span, .avatar-btn .chev, #search-btn, .status-text { display: none; }
  .btn-new { padding: 0 11px; }
  .brand-name { font-size: 17px; }
  .actions { gap: 6px; }
  .nav { gap: 10px; }
  .subbar { padding: 0 12px; }
  .crumbs li:not(.current), .crumbs .sep { display: none; }
  .subbar.has-tabs .crumbs, .subbar.has-tabs .sub-divider, .subbar.has-tabs .status { display: none; }  .notif { width: min(320px, calc(100vw - 32px)); right: -88px; }
  .ghost { height: 90px; }
}

/* ================= SEARCH PALETTE ================= */
.palette {
  position: fixed; inset: 0; z-index: 100;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 14vh 16px 0;
  background: rgba(0, 0, 0, .4);
  backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden;
  transition: opacity .2s, visibility .2s;
}
.palette.open { opacity: 1; visibility: visible; }
.palette-box {
  width: 100%; max-width: 520px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
  transform: translateY(-10px) scale(.97); filter: blur(4px);
  transition: transform .35s cubic-bezier(.2, .9, .3, 1.1), filter .3s;
}
.palette.open .palette-box { transform: none; filter: none; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--muted); }
.palette-input input { flex: 1; background: none; border: 0; outline: 0; font: inherit; font-size: 15px; color: var(--text); }
kbd { font: inherit; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); }
#palette-list { list-style: none; padding: 6px; max-height: 320px; overflow-y: auto; }
#palette-list li { padding: 10px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); }
#palette-list li.sel { background: var(--hover); color: var(--text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   NAVIGATION CONFIG — the only file you edit to change the menu.

   Each section:
     id        url name (no spaces)       → becomes #id in the address bar
     label     text shown in the menu
     icon      one of the keys in ICONS below
     desc      short line shown under the page title
     more      true  → shown inside the "More" dropdown instead of the bar
     group     heading it sits under inside "More"
     pages     the sub-tabs:  { id, label, action?: true }
               (action: true → styled as a "+ create" button)
   ===================================================================== */

window.NAV = [

  {

      { id: "mechanical", label: "Mechanical" },
      { id: "electrical", label: "Electrical" },
      { id: "digital",    label: "Digital" },
    ],
  },
  { id: "project-management", label: "Project Management", icon: "projects", desc: "Coming next.", pages: [] },
  { id: "factory",            label: "Factory",            icon: "factory",  desc: "Coming next.", pages: [] },

  // ---- Inside "More" ----
  { id: "customer-service", label: "Customer service", icon: "support",    more: true, group: "Operations",   desc: "Coming next.", pages: [] },
  { id: "purchasing",       label: "Purchasing",       icon: "purchasing", more: true, group: "Supply chain", desc: "Coming next.", pages: [] },
  { id: "stock",            label: "Stock",            icon: "stock",      more: true, group: "Supply chain", desc: "Coming next.", pages: [] },
  { id: "hr",               label: "HR",               icon: "hr",         more: true, group: "Back office",  desc: "Coming next.", pages: [] },
  { id: "finance",          label: "Finance",          icon: "finance",    more: true, group: "Back office",  desc: "Coming next.", pages: [] },
];

/* Simple line icons (24×24 SVG paths) */
window.ICONS = {
  home:        "M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5",
  sales:       "M3 17l6-6 4 4 8-8M15 7h6v6",
  tendering:   "M14 3H6v18h12V7zM14 3v4h4M9 12h6M9 16h6",
  engineering: "M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z",
  projects:    "M4 4h16v16H4zM9.5 4v16M15 4v10",
  factory:     "M3 21V10l6 4v-4l6 4V6l6 3v12zM7 17h2M12 17h2M17 17h1",
  support:     "M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z",
  purchasing:  "M3 4h2.5l2.2 11h10.6L21 7H6.4M9 20.5h.01M17 20.5h.01",
  stock:       "M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9",
  hr:          "M16 20v-1.5a4 4 0 0 0-8 0V20M12 11a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4M21 20v-1a3 3 0 0 0-2.5-3M17 4.6a3.2 3.2 0 0 1 0 6",

  <script>
// =====================================================================
//  Navigation engine — builds the whole menu from config.js
//  URLs look like:  #sales/customers   (section / sub-page)
// =====================================================================

const $ = s => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SECTIONS = Object.fromEntries(NAV.map(s => [s.id, s]));
const icon = (name, size = 16) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name] || ""}"/></svg>`;
const chev = `<svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>`;

const tabsEl = $("#tabs"), pill = $("#pill");
const crumbsEl = $("#crumbs"), subtabsEl = $("#subtabs"), divider = $("#sub-divider");
const pageEl = $("#page"), titleEl = $("#page-title"), subEl = $("#page-sub"), sweep = $("#sweep");

let state = { section: null, page: null };
let pillPos = null;

// ================= BUILD THE MENUS =================
function buildDesktopTabs() {
  const main = NAV.filter(s => !s.more);
  const more = NAV.filter(s => s.more);

  let html = main.map(s => `<a class="tab" href="#${s.id}" data-section="${s.id}">${s.label}</a>`).join("");

  if (more.length) {
    const groups = [...new Set(more.map(s => s.group || ""))];
    html += `
      <div class="menu">
        <button class="tab more-btn" id="more-btn" data-toggle aria-haspopup="true" aria-expanded="false">
          <span class="more-label">More</span>${chev}
        </button>
        <div class="dropdown mega" role="menu">
          ${groups.map(g => `
            <div class="dd-group">
              ${g ? `<div class="dd-group-label">${g}</div>` : ""}
              ${more.filter(s => (s.group || "") === g).map(s => `
                <a href="#${s.id}" data-section="${s.id}" class="dd-item">
                  <span class="dd-icon">${icon(s.icon)}</span>${s.label}
                </a>`).join("")}
            </div>`).join("")}
        </div>
      </div>`;
  }
  tabsEl.insertAdjacentHTML("beforeend", html);
}

function buildMobileMenu() {
  const main = NAV.filter(s => !s.more);
  const more = NAV.filter(s => s.more);
  const groups = [...new Set(more.map(s => s.group || "More"))];
  const link = s => `<a href="#${s.id}" data-section="${s.id}"><span class="m-icon">${icon(s.icon, 17)}</span>${s.label}</a>`;
  $("#mobile-menu").innerHTML = `<div class="mobile-menu-inner">
    ${main.map(link).join("")}
    ${groups.map(g => `<div class="m-group">${g}</div>${more.filter(s => (s.group || "More") === g).map(link).join("")}`).join("")}
  </div>`;
}

buildDesktopTabs();
buildMobileMenu();
const moreBtn = $("#more-btn"), moreLabel = $(".more-label");

// ================= LIQUID PILL =================
function movePill(el, instant = false) {
  if (!el || !tabsEl.offsetParent) return;
  const box = tabsEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const l = r.left - box.left, rr = box.right - r.right;
  if (instant || !pillPos) pill.style.transition = "none";
  else {
    pill.style.transition = "";
    pill.classList.toggle("to-right", l > pillPos.l);
    pill.classList.toggle("to-left", l <= pillPos.l);
  }
  pill.style.setProperty("--l", l + "px");
  pill.style.setProperty("--r", rr + "px");
  pill.classList.add("ready");
  pillPos = { l, rr };
  if (instant) requestAnimationFrame(() => (pill.style.transition = ""));
}
const activeTabEl = () => tabsEl.querySelector(".tab.active");

// ================= CLICK RING =================
function ring(x, y) {
  if (reduced) return;
  const r = document.createElement("span");
  r.className = "click-ring";
  r.style.left = x + "px";
  r.style.top = y + "px";
  document.body.appendChild(r);
  r.addEventListener("animationend", () => r.remove());
}

// ================= BREADCRUMB =================
function renderCrumbs(sec, pg, animateFrom) {
  const parts = [`<li>Workspace</li>`, `<li class="sep" aria-hidden="true">›</li>`];
  parts.push(pg
    ? `<li><a href="#${sec.id}" data-section="${sec.id}" class="crumb-link${animateFrom === "section" ? " enter" : ""}">${sec.label}</a></li>`
    : `<li class="current${animateFrom ? " enter" : ""}">${sec.label}</li>`);
  if (pg) parts.push(`<li class="sep" aria-hidden="true">›</li><li class="current${animateFrom ? " enter" : ""}">${pg.label}</li>`);
  crumbsEl.innerHTML = parts.join("");
}

// ================= SUB-TABS =================
function renderSubtabs(sec, pg, animate) {
  const build = () => {
    subtabsEl.classList.remove("leaving");
    subtabsEl.innerHTML = sec.pages.map((p, i) => `
      <a href="#${sec.id}/${p.id}" data-section="${sec.id}" data-page="${p.id}"
         class="subtab${p.action ? " action" : ""}${pg && p.id === pg.id ? " active" : ""}" style="--i:${i}">
        ${p.action ? icon("plus", 13) : ""}${p.label}
      </a>`).join("") + (sec.pages.length ? `<span class="sub-line grow"></span>` : "");
    divider.classList.toggle("show", sec.pages.length > 0);
    $(".subbar").classList.toggle("has-tabs", sec.pages.length > 0);
    requestAnimationFrame(() => moveSubLine(true));
  };
  if (animate && subtabsEl.children.length) {
    subtabsEl.classList.add("leaving");
    divider.classList.toggle("show", sec.pages.length > 0);
    setTimeout(build, 170);
  } else build();
}
function moveSubLine(instant) {
  const el = subtabsEl.querySelector(".subtab.active");
  const line = subtabsEl.querySelector(".sub-line");
  if (!el || !line) return;
  if (instant) line.style.transition = "none";
  line.style.width = el.offsetWidth - 16 + "px";
  line.style.transform = `translateX(${el.offsetLeft + 8}px)`;
  if (instant) requestAnimationFrame(() => (line.style.transition = ""));
  el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: instant ? "auto" : "smooth" });
}

// ================= PAGE CONTENT (placeholder for now) =================
let typeTimer;
function typeTitle(text) {
  clearInterval(typeTimer);
  if (reduced) { titleEl.textContent = text; return; }
  let i = 0;
  titleEl.innerHTML = `<span class="t"></span><span class="caret"></span>`;
  const t = titleEl.querySelector(".t");
  typeTimer = setInterval(() => {
    t.textContent = text.slice(0, ++i);
    if (i >= text.length) {
      clearInterval(typeTimer);
      setTimeout(() => titleEl.querySelector(".caret")?.remove(), 500);
    }
  }, 40);
}
function fillPage(sec, pg, animate) {
  const title = pg ? pg.label : sec.label;
  subEl.textContent = pg ? `${sec.label} · ${sec.desc}` : sec.desc;
  pageEl.querySelectorAll(".ghost").forEach((g, i) => g.style.setProperty("--d", i));
  pageEl.classList.remove("out");
  if (animate) {
    pageEl.classList.remove("in"); void pageEl.offsetWidth; pageEl.classList.add("in");
    typeTitle(title);
  } else titleEl.textContent = title;
}

// ================= ROUTER =================
function parseHash() {
  const [s, p] = location.hash.slice(1).split("/");
  const sec = SECTIONS[s] || NAV[0];
  const pg = sec.pages.find(x => x.id === p) || sec.pages.find(x => !x.action) || null;
  return { sec, pg };
}

let navTimer;
function go(sec, pg, animate = true) {
  const sameSection = state.section === sec.id;
  if (sameSection && state.page === (pg && pg.id)) { closeMenus(); closeMobile(); return; }
  state = { section: sec.id, page: pg && pg.id };
  document.title = `Tideline — ${pg ? pg.label : sec.label}`;

  if (sameSection) {
    // ---- only the sub-page changed: slide underline, retype title ----
    subtabsEl.querySelectorAll(".subtab").forEach(s => s.classList.toggle("active", s.dataset.page === state.page));
    moveSubLine(false);
    renderCrumbs(sec, pg, "page");
    fillPage(sec, pg, animate);
  } else {
    // ---- new section: pill, crumbs, sub-tabs, wave ----
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    const tab = sec.more ? moreBtn : tabsEl.querySelector(`.tab[data-section="${sec.id}"]`);
    tab?.classList.add("active");
    if (moreLabel) moreLabel.textContent = sec.more ? sec.label : "More";
    requestAnimationFrame(() => movePill(tab, !animate));
    renderCrumbs(sec, pg, animate ? "section" : null);
    renderSubtabs(sec, pg, animate);

    clearTimeout(navTimer);
    if (animate && !reduced) {
      pageEl.classList.remove("in");
      pageEl.classList.add("out");
      sweep.classList.remove("run"); void sweep.offsetWidth; sweep.classList.add("run");
      navTimer = setTimeout(() => fillPage(sec, pg, true), 430);
      setTimeout(() => sweep.classList.remove("run"), 1200);
    } else fillPage(sec, pg, animate);
  }

  document.querySelectorAll(".dd-item[data-section], .mobile-menu a").forEach(a =>
    a.classList.toggle("active", a.dataset.section === sec.id));
  closeMenus();
  closeMobile();
}

function navigate(hash) {
  history.replaceState(null, "", "#" + hash);
  const { sec, pg } = parseHash();
  go(sec, pg);
}

document.addEventListener("click", e => {
  const link = e.target.closest("a[data-section]");
  if (!link) return;
  e.preventDefault();
  if (link.classList.contains("tab")) ring(e.clientX, e.clientY);
  navigate(link.dataset.section + (link.dataset.page ? "/" + link.dataset.page : ""));
});

// ================= DROPDOWNS =================
function closeMenus(except) {
  document.querySelectorAll(".menu.open").forEach(m => {
    if (m === except) return;
    m.classList.remove("open");
    m.querySelector("[data-toggle]")?.setAttribute("aria-expanded", "false");
  });
}
document.querySelectorAll("[data-toggle]").forEach(btn =>
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const menu = btn.closest(".menu");
    closeMenus(menu);
    btn.setAttribute("aria-expanded", menu.classList.toggle("open"));
  }));
document.addEventListener("click", e => { if (!e.target.closest(".dropdown")) closeMenus(); });

$("#mark-read").addEventListener("click", e => {
  e.stopPropagation();
  document.querySelectorAll(".notif-item.unread").forEach((n, i) => setTimeout(() => n.classList.remove("unread"), i * 90));
  $("#badge").classList.add("hide");
});

// ================= THEME: circle reveal from the button =================
const root = document.documentElement;
$("#theme-btn").addEventListener("click", e => {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  const apply = () => {
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (err) {}
  };
  if (!document.startViewTransition || reduced) return apply();
  const b = e.currentTarget.getBoundingClientRect();
  const x = b.left + b.width / 2, y = b.top + b.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(apply).ready.then(() => {
    root.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
      { duration: 750, easing: "cubic-bezier(.65, 0, .25, 1)", pseudoElement: "::view-transition-new(root)" }
    );
  });
});

// ================= MOBILE MENU =================
const burger = $("#burger"), mobileMenu = $("#mobile-menu");
function closeMobile() {
  burger.classList.remove("open");
  mobileMenu.classList.remove("open");
  burger.setAttribute("aria-expanded", "false");
}
burger.addEventListener("click", () => {
  const open = mobileMenu.classList.toggle("open");
  burger.classList.toggle("open", open);
  burger.setAttribute("aria-expanded", open);
  mobileMenu.querySelectorAll("a, .m-group").forEach((a, i) => (a.style.transitionDelay = open ? `${60 + i * 28}ms` : "0ms"));
});

// ================= CLOCK =================
const clock = $("#clock");
const tick = () => (clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
tick(); setInterval(tick, 15000);

// ================= SEARCH PALETTE (Ctrl/Cmd + K) =================
// Lists every section and every sub-page
const ENTRIES = NAV.flatMap(s => [
  { hash: s.id, text: s.label, icon: s.icon },
  ...s.pages.map(p => ({ hash: `${s.id}/${p.id}`, text: `${s.label} › ${p.label}`, icon: s.icon })),
]);
const palette = $("#palette"), pInput = $("#palette-input"), pList = $("#palette-list");
let sel = 0, results = [];
function renderPalette() {
  const q = pInput.value.trim().toLowerCase();
  results = ENTRIES.filter(e => e.text.toLowerCase().includes(q));
  sel = Math.min(sel, Math.max(results.length - 1, 0));
  pList.innerHTML = results.length
    ? results.map((e, i) => `<li data-h="${e.hash}" class="${i === sel ? "sel" : ""}">${icon(e.icon, 15)}<span>${e.text}</span></li>`).join("")
    : `<li>No matches</li>`;
  pList.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}
function openPalette() { palette.classList.add("open"); pInput.value = ""; sel = 0; renderPalette(); setTimeout(() => pInput.focus(), 50); }
function closePalette() { palette.classList.remove("open"); }
function pick(h) { closePalette(); navigate(h); }
$("#search-btn").addEventListener("click", openPalette);
palette.addEventListener("click", e => { if (e.target === palette) closePalette(); });
pInput.addEventListener("input", () => { sel = 0; renderPalette(); });
pList.addEventListener("click", e => { const li = e.target.closest("li[data-h]"); if (li) pick(li.dataset.h); });
pInput.addEventListener("keydown", e => {
  if (!results.length) return;
  if (e.key === "ArrowDown") { sel = (sel + 1) % results.length; renderPalette(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = (sel - 1 + results.length) % results.length; renderPalette(); e.preventDefault(); }
  if (e.key === "Enter") pick(results[sel].hash);
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  if (e.key === "Escape") { closePalette(); closeMenus(); closeMobile(); }
});
